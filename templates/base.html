<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Expense Tracker
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header class="navbar">

        <div class="navbar-content">

            <a href="{{ url_for('home') }}" class="logo">
                💰 Expense Tracker
            </a>

            <a href="{{ url_for('add_expense') }}" class="nav-add">
                + Add Expense
            </a>

        </div>

    </header>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
