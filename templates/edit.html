{% extends "base.html" %}


{% block title %}
Edit Expense
{% endblock %}


{% block content %}

<h1>Edit Expense</h1>


<form method="POST">

<label>Name:</label>
<input 
type="text" 
name="name"
value="{{ expense.name }}"
>


<br><br>


<label>Amount:</label>
<input 
type="number" 
step="0.01"
name="amount"
value="{{ expense.amount }}"
>


<br><br>


<label>Category:</label>
<input 
type="text"
name="category"
value="{{ expense.category }}"
>


<br><br>


<button type="submit">
Save Changes
</button>


</form>


{% endblock %}
