{% extends "base.html" %}

{% block title %}
Add Expense
{% endblock %}

{% block content %}

<form method="POST">
    
    <!-- Always include a hidden field for category -->
    <input type="hidden" name="category" value="{{ category or '' }}">
    
    <label>Category:</label>
    {% if category %}
        <input type="text" value="{{ category }}" readonly disabled>
    {% else %}
        <input type="text" name="category_display" required>
        <!-- Note: we don't use name="category" here to avoid conflicts -->
    {% endif %}

    <br><br>

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Amount:</label>
    <input type="number" step="0.01" name="amount" required>

    <br><br>

    <button type="submit">
        Add Expense
    </button>

</form>

{% endblock %}
